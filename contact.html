<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Sarp Mataş</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Consolas&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --accent-color: #f43f5e;
        --glow-color: rgba(244, 63, 94, 0.25);
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <a
            href="index.html"
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              text-decoration: none;
              color: inherit;
            "
          >
            <img src="logo.png" alt="Logo" class="nav-icon" /> Sarp Mataş
          </a>
        </div>
        <div class="hamburger">
          <span class="bar"></span><span class="bar"></span
          ><span class="bar"></span>
        </div>
        <ul class="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="cv.html">CV</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="page-section">
        <h2 class="section-title">Get In Touch</h2>
        <div class="contact-container">
          <form id="contactForm">
            <div class="form-group">
              <input type="text" id="name" placeholder="Your Name" required />
            </div>
            <div class="form-group">
              <input
                type="email"
                id="email"
                placeholder="Your Email"
                required
              />
            </div>
            <div class="form-group">
              <textarea
                id="message"
                rows="5"
                placeholder="Your Message..."
                required
              ></textarea>
            </div>
            <button type="submit">Send Message</button>
          </form>
          <div class="social-connect">
            <h3>Or Connect Via</h3>
            <div class="social-links-row">
              <a
                href="https://linkedin.com/in/sarpmatas"
                target="_blank"
                class="social-icon"
                ><i class="fa-brands fa-linkedin"></i
              ></a>
              <a
                href="https://github.com/Dionysos22"
                target="_blank"
                class="social-icon"
                ><i class="fa-brands fa-github"></i
              ></a>
              <a href="mailto:sarpmatas0@gmail.com" class="social-icon"
                ><i class="fa-solid fa-envelope"></i
              ></a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2026 Sarp Mataş | Designed by <strong>Dionysos</strong></p>
    </footer>
    <script src="js/script.js"></script>
  </body>
</html>
